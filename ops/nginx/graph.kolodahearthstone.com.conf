server {
    listen 151.80.21.140:80;
    listen [2001:41d0:c:c8c::]:80;
    server_name graph.kolodahearthstone.com;

    root /var/www/graph.kolodahearthstone.com;
    index index.html;

    access_log /var/www/httpd-logs/graph.kolodahearthstone.com.access.log;
    error_log /var/www/httpd-logs/graph.kolodahearthstone.com.error.log notice;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
