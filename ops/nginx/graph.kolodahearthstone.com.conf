server {
    listen 151.80.21.140:80;
    listen [2001:41d0:c:c8c::]:80;
    server_name graph.kolodahearthstone.com;

    location / {
        return 301 https://graph.kolodahearthstone.com$request_uri;
    }
}

server {
    listen 151.80.21.140:443 ssl;
    listen [2001:41d0:c:c8c::]:443 ssl;
    server_name graph.kolodahearthstone.com;

    root /var/www/graph.kolodahearthstone.com/current;
    index index.html;

    ssl_certificate /etc/ssl/cloudflare-origin/graph.kolodahearthstone.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin/graph.kolodahearthstone.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/www/httpd-logs/graph.kolodahearthstone.com.access.log;
    error_log /var/www/httpd-logs/graph.kolodahearthstone.com.error.log notice;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /repositories.tsv {
        expires -1;
        try_files $uri =404;
    }

    location = /graph-model.mjs {
        types { application/javascript mjs; }
        expires -1;
        try_files $uri =404;
    }

    location /graphs/ {
        expires 5m;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
