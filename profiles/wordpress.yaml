profile: wordpress
version: 1
description: WordPress-сайты, редактор, плагины и эксплуатация.

activation: on-demand
available:
  - wordpress/hs-manacost-project
  - wordpress/hs-manacost/wordpress-accessibility
  - wordpress/hs-manacost/wordpress-clean-code
  - wordpress/hs-manacost/wordpress-content-integrity
  - wordpress/hs-manacost/wordpress-release-manager
  - wordpress/wp-project-triage

variants:
  - namespace: wordpress/kolodahearthstone
    when: project-root-is-kolodahearthstone

guardrails:
  - never-edit-var-www-as-source
  - protect-production-and-credentials
  - run-wordpress-quality-gate
